# Menjaga proyek Supabase gratis tidak dijeda karena tidak aktif.
# Simpan sebagai: .github/workflows/keepalive.yml di repositori GitHub.
name: Keepalive Supabase

on:
  schedule:
    - cron: "17 3 * * 1,4"   # Senin dan Kamis, 03:17 UTC
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database Supabase
        run: |
          curl -fsS -X POST "https://rmmfiunormsowrjtochm.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_EhUXw6fEVUXHMADdaxTdjw_Vxwnq1gK" \
            -H "Content-Type: application/json" \
            -d '{}'
